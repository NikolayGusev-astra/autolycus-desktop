[package]
name = "steersman-desktop"
version = "3.3.0"
description = "Штурман Desktop — native desktop AI assistant"
authors = ["Штурман Team"]
license = "MIT"
edition = "2021"

[lib]
name = "steersman_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls", "socks"] }
futures = "0.3"
# ADR-004: WebSocket client for the /api/ws JSON-RPC transport. rustls-tls
# matches the reqwest TLS stack (no native-tls/OpenSSL split).
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# ADR-004 P3.4: structured logging. Replaces ad-hoc eprintln! in the WS path
# (ws_transport.rs, gateway.rs) with level-filtered, field-carrying spans.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ssh2 = "0.9"
yaml-rust2 = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
base64 = "0.22"
keyring = "2"
regex = "1"
arc-swap = "1"
sha2 = "0.10"

# macOS universal binary cross-compile: OpenSSL not found via pkg-config.
# Vendored build compiles OpenSSL from source (adds ~2 min to build time).
[target.'cfg(target_os = "macos")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }
