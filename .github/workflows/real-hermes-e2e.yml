name: Real Hermes E2E

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (e.g. main, v1.2.3)"
        required: false
        default: ""
  schedule:
    # Daily at 06:00 UTC — catch regressions before they reach users.
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  real-hermes-e2e:
    name: Real Hermes E2E tests
    runs-on: ubuntu-latest
    # Secrets are configured in the repository environment.
    environment: hermes-e2e
    concurrency:
      group: hermes-e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Tauri system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libglib2.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Preflight — HERMES_TEST_API_KEY must be set
        env:
          HERMES_TEST_API_KEY: ${{ secrets.HERMES_TEST_API_KEY }}
        run: |
          if [ -z "$HERMES_TEST_API_KEY" ]; then
            echo "::error::HERMES_TEST_API_KEY is not configured in the hermes-e2e environment."
            exit 1
          fi
          echo "HERMES_TEST_API_KEY is configured."

      - name: Run real Hermes E2E tests
        env:
          HERMES_TEST_URL: ${{ secrets.HERMES_TEST_URL || 'ws://localhost:8642/api/ws' }}
          HERMES_TEST_API_KEY: ${{ secrets.HERMES_TEST_API_KEY }}
          HERMES_TEST_PROFILE: ${{ secrets.HERMES_TEST_PROFILE || 'e2e-test' }}
          HERMES_TEST_MCP_TOOL: ${{ secrets.HERMES_TEST_MCP_TOOL || 'steersman_list_tasks' }}
        run: |
          cargo test \
            --manifest-path src-tauri/Cargo.toml \
            --test real_hermes_e2e \
            -- --ignored --test-threads=1

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-e2e-logs
          path: |
            src-tauri/target/debug/*.d
            src-tauri/target/debug/.cargo-lock
          retention-days: 7